title: Art Wall
date: October 12, 2023
abstract: |
  I went to SF one and a buddy and I wandered into a comic book store.  They had some local artists there so I bought a print (Fig 1a) - Natalie Andrewson.  At that time in my life, buying art felt quite foreign.  Later, in 2023ish, I went to Ed Hopper's museum in Cape Ann.  There was a card that really liked and so I bought it (Fig 1b) - Elizabeth N. deVicq.  Fast forward, when I moved into my own place, this idea of displaying all my art on "tracks" came to me one day.  I am anti-gallery wall bc they typically feel too messy and stagnant to me.  I wanted something adjacent to a gallery wall, and ultimately decided to have really small horizontal shelfs hanging in my room.  The design I went for meant there is chaos amidst the built in order and structure (on brand for me) and art/postcards could easily be switched out, unlike in gallery walls.  I don't think this was a very hard built, but this was one of the earlier projects I worked on post graduating college, and I it was a good lesson in ideating, executing, and basking in the final product.

