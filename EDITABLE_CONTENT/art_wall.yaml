method: |
  I really didn't do much planning for this project.  I measured the area I wanted the tracks to cover and initially started with 2.  I bought some rectangular pine trim from the hardware store, table sawed a little groove out, sanded and stained, and hung them up.  Fig 2 shows the first iteration and it's profile.  

  <div class="figure-row">
    <figure class="auto-figure" id="fig2a">
      <img src="assets/images/art_wall/Fig_2_a.jpg" alt="v1 wall">
        <figcaption>Figure 2a</figcaption>
    </figure>
    <figure class="auto-figure" id="fig2b">
      <img src="assets/images/art_wall/Fig_2_b.jpg" alt="v1 profile">
        <figcaption>Figure 2b</figcaption>
    </figure>
  </div>

  I quickly realized that 2 tracks wasn't enough, so I doubled the amount.  I cut them out essentially the same, and was left with a wall as shown in Fig 3.  This design persisted for several months (years?) but after a while, my postcard collection outgrew the space.  

  <br>
  <figure class="auto-figure" id="Fig_3">
    <img src="assets/images/art_wall/Fig_3.jpg" alt="v2 of wall">
      <figcaption>Figure 3</figcaption>
  </figure>

  Initially I had a really large mirror in my bedroom (my first piece of furnature in our apt which I found outside of it the night I got the keys).  I moved the mirror out of my room bc it was too big and I wanted to make room for a desk.  This freed up a lot of wall space, so I decided to again 2x my track area.  This time, I cut plywood down into the same dimensions as the trim and again used the track saw to cut grooves.  The decision to use plywood was two fold, 1) because I thought the plywood face would give some added aesthetic appeal and 2) because it would be signifigantly cheaper.  The downside, is that the plywood is far more flexible.  That doesn't really matter for my purpose, just means that I had to use more command strips to hold them up.  The plywood also is less straight, so the new tracks are definitely not equidistant apart at all points, but my main goal was to maximize art display area, which I acheived.  I didn't stain the new tracks because I lost my wood stain and I was eager to hang the tracks up.  Fig 4 shows the final state.  When I move into a home one day, I want to have a huge feature wall with all my postcards.

  <br>
