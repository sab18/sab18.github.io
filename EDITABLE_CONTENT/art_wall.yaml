discussion: |
  This part of my room is what I am most proud of.  Everything else in my room is very much fine, but this wall (and showing people this wall) makes me happy.  I have an insane number of postcards - they've become my go to souvenir.  I did the math once, and I've spent several thousands on postcards/cards/art over the past few years, but it's for sure worth it.  I'm starting to get to the place where I think I should cut back, because I just don't need this many postcards, but sometimes I just can't resist.
  
  List of some of my fave "local" artists:<br>
  <div style="margin-left:20px;">
    <p>- Lylle Castonguay</p>
    <p>- Natalie Andrewson</p>
    <p>- Maddie Rose Templeton</p>
  </div>

  <br>
  It's funny because four years ago I wouldn't be caught dead in an art museum.  I got super bored in them and just really thought it wasn't my thing.  This journey of collecting postcards has really instigated my interest in art and learning about artists.  It's weird, because pretty organically went from hate to love, but I suppose that's just how it goes sometimes.
