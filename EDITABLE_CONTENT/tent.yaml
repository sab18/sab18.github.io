title: Tent
date: November 10, 2025
abstract: |

  WIP

  I went on a week long + camping trip with my best bud earlier this year.  I have a couple different tents (one I got off Amazon in high school for $12, one my mom got from her work's points catolog, and one a friend gave me).  When camping out in Shenandoah, I brought the Coleman my mom gave me - it is nice because it is big and can hold its own, but it's pretty clunky.  It doesn't pack down easily and is really heavy.  After admiring someone with a tent that looked to be extremely light weight, I knew I just had to make my own tent.
method: |
  This is definitely one of the more daunting projects I've signed myself up for.  There are so many moving parts (none of which I really know how to do).  It's like going to the library, opening your computer, and staring at a blank google doc having no clue what you're about to write a ten page essay on.  That surely is a feeling I never want to endure again.

  Anyhoo, like most projects, I go hard for a while, reach a road block, put it down for several months, then finally get back after it.

  My initial plan was to make a 2 person tent, similar to your standard REI tent.  I essentially want to base my design (mainly dimensions) on theirs as much as possible.  This [LINK] REI site proved to give me a good starting point.  Then I did some light research to id other tent widths and lengths and heights till I settled on what I thought would be best to optimize weight, comfort, and material usage.  Fig 1 is what my final design looks like.

