  In the final version, I made significant aesthetic changes.  I based the dimensions on some inspo pics and added hardware for the drawer handles from McMaster.  At this point, I was satisfied with this as the end product.  As shown in Fig 4, the final product looks more dresser-esque and is up to par with its fast furnature competitors.

