  v2 is giving file cabinet.  Pros: I upgraded the sliding mechanism to be on the side of the drawers.  Fig 2a demonstrates this secondary design, which requires fewer pieces of wood per draw for a nice smooth slide.  There's a bit more work in terms of routing with this version (Fig 2b), so the drawer can easily mate into and glide on the wooden runners, but overall this design is much more simplistic which I like.  Cons: it's still giving file cabinet.
  
