title: Timesheet
date: November 17, 2025
abstract: |
  Since living that 9-5 life, I have to track my hours for work.  I'd probably do this anyway, since I like collecting data like this in general.  I used to fill out an Excel sheet at the end of every day and at the end of every week submit them online.  This worked for a solid two years, but eventually I grew out of that system.  It was becoming clunky after it's original reliability.  Every year, I made improvements - you can observe the evolution from my very first version (Fig 1) to my most recent (Fig 2).<br>  Initially, there was a lot of manual work.  For each month I'd have to input the month/year (at least the actual days auto populated).  It was overall just pretty limited - tho I did make good use of the Time In/Time Out function.  Over time, I mainly used the Notes function and actual project tracking - the rest became irrelevant.  The new iterations relied more on semi-intense Formulas to automate as much as possible.  All the projects would auto populate as would the dates.  Even still, I wanted something that was easier to use, hense why I created my own timesheet software.

  I actually had this idea nearly a year ago (late 2024) and nearly had it working by the new year.  That was my goal anyway.  Ofc it did not go to plan, and I got a solid 80% of the way there before stalling out.  Fast forward to September time frame, I was ready to take a second stab at it.

